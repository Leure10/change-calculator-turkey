<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0B3B39" />
  <meta name="description" content="Calculate your change in TRY, EUR and USD while shopping in Turkey. Works offline." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Change" />
  <title>Change Calculator (Para Üstü)</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- HEADER -->
    <header class="header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M14 3.5 L11 21 L16 18.5 M6.5 10.5 L17.5 7 M6.5 14.5 L17.5 11" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="brand-text">
          <h1>Change Calculator</h1>
          <p>Para Üstü Hesaplayıcı</p>
        </div>
      </div>
      <button id="resetBtn" class="btn-reset" type="button">
        <span>Clear</span><span class="sub">Temizle</span>
      </button>
    </header>

    <!-- RATE STATUS -->
    <div id="rateBar" class="rate-bar rate-loading" role="status" aria-live="polite">
      <span class="rate-dot"></span>
      <span id="rateText">Loading rates… · Kur yükleniyor…</span>
    </div>

    <main class="content">

      <!-- 1. MERCHANT PRICE (one box only) -->
      <section class="block">
        <h2 class="block-title">Merchant price <span>Satıcı fiyatı</span></h2>
        <div class="row row-3">
          <label class="box">
            <input id="priceTry" class="in-price" data-cur="TRY" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Price in Turkish lira" />
            <span class="cur">₺ TRY</span>
          </label>
          <label class="box">
            <input id="priceEur" class="in-price" data-cur="EUR" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Price in euro" />
            <span class="cur">€ EUR</span>
          </label>
          <label class="box">
            <input id="priceUsd" class="in-price" data-cur="USD" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Price in US dollars" />
            <span class="cur">$ USD</span>
          </label>
        </div>
      </section>

      <!-- 2. CONVERSION (automatic) -->
      <section class="block">
        <h2 class="block-title">Conversion <span>Dönüşüm</span></h2>
        <div class="row row-4">
          <div class="box out"><output id="convTry">—</output><span class="cur">₺ TRY</span></div>
          <div class="box out"><output id="convEur">—</output><span class="cur">€ EUR</span></div>
          <div class="box out"><output id="convUsd">—</output><span class="cur">$ USD</span></div>
          <div class="box out"><output id="convRon">—</output><span class="cur">lei RON</span></div>
        </div>
      </section>

      <!-- 3. PAYMENT (one or more boxes, summed) -->
      <section class="block">
        <h2 class="block-title">You pay with <span>Ödeme</span></h2>
        <div class="row row-3">
          <label class="box">
            <input id="payTry" class="in-pay" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Paid in Turkish lira" />
            <span class="cur">₺ TRY</span>
          </label>
          <label class="box">
            <input id="payEur" class="in-pay" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Paid in euro" />
            <span class="cur">€ EUR</span>
          </label>
          <label class="box">
            <input id="payUsd" class="in-pay" type="text" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Paid in US dollars" />
            <span class="cur">$ USD</span>
          </label>
        </div>
      </section>

      <!-- 4. BUTTON -->
      <button id="calcBtn" class="btn-calc" type="button">
        <span class="btn-en">CALCULATE CHANGE</span>
        <span class="btn-tr">Para Üstünü Hesapla</span>
      </button>

      <!-- 5. CHANGE -->
      <section id="result" class="block result" aria-live="polite">
        <h2 id="resultTitle" class="block-title">Change <span>Para üstü</span></h2>
        <div class="row row-3">
          <div class="box out big"><output id="outTry">—</output><span class="cur">₺ TRY</span></div>
          <div class="box out big"><output id="outEur">—</output><span class="cur">€ EUR</span></div>
          <div class="box out big"><output id="outUsd">—</output><span class="cur">$ USD</span></div>
        </div>
      </section>

    </main>

    <footer class="footer">
      <span id="footRate">—</span>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
